name: Tiny Factory major-branch validation and deployment

on:
  push:
    branches:
      - main
      - 'v[0-9].[0-9][0-9]'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated main build to the configured Roblox target
        required: true
        default: false
        type: boolean

concurrency:
  group: tiny-factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Tiny Factory
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Luau test runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/luau
          curl --fail --location --retry 3 \
            https://github.com/luau-lang/luau/releases/download/0.737/luau-ubuntu.zip \
            -o .tools/luau.zip
          unzip -q .tools/luau.zip -d .tools/luau
          chmod +x .tools/luau/luau .tools/luau/luau-compile

      - name: Validate reusable 3D GLB sources and manifest
        shell: bash
        run: python3 scripts/import_3d_assets.py --validate-only

      - name: Test Roblox 3D import helpers
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Compile Luau sources and tests
        shell: bash
        run: |
          set -euo pipefail
          if ! .tools/luau/luau-compile -t1 $(find src tests -name '*.luau' -print) > .tools/luau/compile.log 2>&1; then
            cat .tools/luau/compile.log
            exit 1
          fi

      - name: Run all simulation and rules tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.luau; do
            echo "Running $test_file"
            .tools/luau/luau "$test_file"
          done

      - name: Set up Rokit toolchain
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0

      - name: Build and verify Rojo project
        shell: bash
        run: |
          set -euo pipefail
          rojo build default.project.json --output /tmp/TinyFactoryValidation.rbxlx
          test -s /tmp/TinyFactoryValidation.rbxlx
          grep -q "PrototypeBaseplate" /tmp/TinyFactoryValidation.rbxlx
          grep -q "PrototypeSpawn" /tmp/TinyFactoryValidation.rbxlx
          grep -q "LootService" /tmp/TinyFactoryValidation.rbxlx

  publish:
    name: Publish validated main build
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish == true) ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Rokit toolchain
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0

      - name: Build Tiny Factory place
        shell: bash
        run: rojo build default.project.json --output TinyFactory.rbxlx

      - name: Verify Roblox target
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY" || { echo "ROBLOX_API_KEY secret is missing"; exit 1; }
          test -n "$ROBLOX_UNIVERSE_ID" || { echo "ROBLOX_UNIVERSE_ID secret is missing"; exit 1; }
          test -n "$ROBLOX_PLACE_ID" || { echo "ROBLOX_PLACE_ID secret is missing"; exit 1; }
          curl --fail --silent --show-error \
            --header "x-api-key: $ROBLOX_API_KEY" \
            "https://apis.roblox.com/cloud/v2/universes/$ROBLOX_UNIVERSE_ID/places/$ROBLOX_PLACE_ID" \
            --output place-response.json

      - name: Publish Tiny Factory
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if [[ "$attempt" -gt 1 ]]; then
              sleep $(( (attempt - 1) * 30 ))
            fi
            response_file="publish-response-$attempt.json"
            http_code=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "x-api-key: $ROBLOX_API_KEY" \
              --header "Content-Type: application/xml" \
              --data-binary @TinyFactory.rbxlx \
              "https://apis.roblox.com/universes/v1/$ROBLOX_UNIVERSE_ID/places/$ROBLOX_PLACE_ID/versions?versionType=Published")
            echo "Publish attempt $attempt: HTTP $http_code"
            if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
              exit 0
            fi
            if [[ "$http_code" != "409" && "$http_code" != "429" && ! "$http_code" =~ ^5 ]]; then
              cat "$response_file"
              exit 1
            fi
          done
          exit 1
